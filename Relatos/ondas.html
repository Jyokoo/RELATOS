<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ondas y Figuras Interactivas</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      background-color: #000000;
      width: 100vw;
      height: 100vh;
      overflow: hidden;
      cursor: default;
      user-select: none;
    }

    body.modo-activo {
      cursor: crosshair;
    }

    /* Panel inferior flotante para las figuras */
    .panel-figuras {
      position: fixed;
      bottom: 32px;
      left: 50%;
      transform: translateX(-50%);
      display: flex;
      gap: 20px;
      z-index: 100;
      align-items: center;
    }

    .btn-figura {
      background: transparent;
      border: none;
      padding: 6px;
      cursor: pointer;
      opacity: 0.45;
      transform: scale(0.95);
      transition: opacity 0.3s ease, transform 0.3s cubic-bezier(0.16, 1, 0.3, 1), filter 0.3s ease;
    }

    .btn-figura:hover {
      opacity: 0.85;
      transform: scale(1.03);
    }

    .btn-figura.activo {
      opacity: 1;
      transform: scale(1.1);
      filter: drop-shadow(0 0 14px rgba(255, 220, 0, 0.65));
    }

    .btn-figura img {
      width: 64px;
      height: auto;
      display: block;
      pointer-events: none;
    }

    /* Estilos optimizados de las ondas con aceleración por GPU */
    .ripple {
      position: fixed;
      width: 140px;
      height: 140px;
      pointer-events: none;
      transform: translate(-50%, -50%) scale(0.15) translateZ(0);
      transform-origin: center center;
      animation: expandRipple 3.2s cubic-bezier(0.16, 1, 0.3, 1) forwards;
      will-change: transform, opacity;
      overflow: visible;
      z-index: 10;
      filter: drop-shadow(0 0 8px currentColor) drop-shadow(0 0 16px currentColor);
    }

    /* Trazos dinámicos heredando currentColor */
    .ripple-path {
      fill: none;
      stroke: currentColor;
      stroke-miterlimit: 10;
      stroke-width: 3px;
    }

    .miedo-path-sub {
      fill: none;
      stroke: currentColor;
      stroke-miterlimit: 10;
      stroke-width: 1px;
      opacity: 0.6;
    }

    @keyframes expandRipple {
      0% {
        opacity: 0.95;
        transform: translate(-50%, -50%) scale(0.15) rotate(0deg) translateZ(0);
      }
      100% {
        opacity: 0;
        transform: translate(-50%, -50%) scale(6.5) rotate(25deg) translateZ(0);
      }
    }
  </style>
</head>
<body>

    // =========================================================================
    // ESTADO Y GENERACIÓN AUTOMÁTICA DE BOTONES
    // =========================================================================
    let emocionActivaKey = null;
    let isMouseDown = false;
    let lastSpawnTime = 0;
    const throttleDelay = 70;
    let interactionStep = 0;

    const panelFiguras = document.getElementById('panelFiguras');
    const fragment = document.createDocumentFragment();

    Object.entries(EMOCIONES).forEach(([key, data]) => {
      const btn = document.createElement('button');
      btn.className = 'btn-figura';
      btn.dataset.emocion = key;
      btn.setAttribute('aria-label', data.nombre);
      btn.title = data.nombre;

      const img = document.createElement('img');
      img.src = data.figuraSrc;
      img.alt = data.nombre;

      btn.appendChild(img);
      fragment.appendChild(btn);

      btn.addEventListener('click', (e) => {
        e.stopPropagation();
        alternarEmocion(key);
      });
    });
    panelFiguras.appendChild(fragment);

    function alternarEmocion(key) {
      emocionActivaKey = (emocionActivaKey === key) ? null : key;

      document.querySelectorAll('.btn-figura').forEach((btn) => {
        btn.classList.toggle('activo', btn.dataset.emocion === emocionActivaKey);
      });

      document.body.classList.toggle('modo-activo', emocionActivaKey !== null);
    }

    // =========================================================================
    // LÓGICA DE COLOR Y ONDAS OPTIMIZADA
    // =========================================================================
    function getDynamicColor(config) {
      interactionStep += 0.15;
      const centerHue = (config.hueMin + config.hueMax) * 0.5;
      const amplitude = (config.hueMax - config.hueMin) * 0.5;
      
      const baseHue = centerHue + Math.sin(interactionStep) * (amplitude * 0.85);
      const hue = Math.round(baseHue + (Math.random() - 0.5) * 5);
      const saturation = Math.round(config.satMin + Math.random() * (config.satMax - config.satMin));
      const lightness = Math.round(config.lightMin + Math.random() * (config.lightMax - config.lightMin));

      return `hsl(${hue}, ${saturation}%, ${lightness}%)`;
    }

    function createRipple(x, y, isClick = false) {
      if (!emocionActivaKey) return;

      const emocion = EMOCIONES[emocionActivaKey];
      let burstCount = isClick ? 3 : 1;
      if (emocionActivaKey === 'alegria' || emocionActivaKey === 'ira') {
        burstCount = isClick ? 6 : 2;
      }

      for (let i = 0; i < burstCount; i++) {
        setTimeout(() => {
          const temp = document.createElement('div');
          
          if (emocion.esParticulaEstela) {
            let bubbleCount = 4 + Math.floor(Math.random() * 5);
            let svgContent = `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 220 220" class="ripple">`;
            for (let b = 0; b < bubbleCount; b++) {
              let cx = 110 + (Math.random() - 0.5) * 90;
              let cy = 110 + (Math.random() - 0.5) * 90;
              let r = 8 + Math.random() * 24;
              let strokeWidth = 1.5 + Math.random() * 2.5;
              svgContent += `<circle cx="${cx}" cy="${cy}" r="${r}" fill="none" stroke="currentColor" stroke-miterlimit="10" stroke-width="${strokeWidth}" />`;
            }
            svgContent += `</svg>`;
            temp.innerHTML = svgContent;
          } 
          else if (emocion.esEstelaAlegria) {
            let rot = Math.random() * 360;
            let scaleInner = 0.8 + Math.random() * 0.4;
            temp.innerHTML = `
              <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 244.89 244.89" class="ripple">

          else {
            temp.innerHTML = emocion.ondaSvg;
          }

          if (!ripple) return;

          let offsetX = 0;
          let offsetY = 0;
          if (emocionActivaKey === 'asco') {
            offsetX = (Math.random() - 0.5) * 35;
            offsetY = (Math.random() - 0.5) * 35;
            const randomScale = 0.6 + Math.random() * 0.7;
            ripple.style.transform = `translate(-50%, -50%) scale(${0.15 * randomScale}) translateZ(0)`;
          } else if (emocionActivaKey === 'alegria' || emocionActivaKey === 'ira') {
            offsetX = (Math.random() - 0.5) * 45;
            offsetY = (Math.random() - 0.5) * 45;
          }

          ripple.style.left = `${x + offsetX}px`;
          ripple.style.top = `${y + offsetY}px`;
          ripple.style.color = getDynamicColor(emocion.colorConfig);

          document.body.appendChild(ripple);

          ripple.addEventListener('animationend', () => {
            ripple.remove();
          }, { once: true });

    // =========================================================================
    // EVENTOS DE INTERACCIÓN OPTIMIZADOS
    // =========================================================================
    window.addEventListener('pointerdown', (e) => {
      if (e.target.closest('.panel-figuras') || !emocionActivaKey) return;
      isMouseDown = true;
      createRipple(e.clientX, e.clientY, true);
    }, { passive: true });

    window.addEventListener('pointerup', () => {
      isMouseDown = false;
    }, { passive: true });

    window.addEventListener('pointermove', (e) => {
      if (!isMouseDown || !emocionActivaKey) return;

      const now = Date.now();
      if (now - lastSpawnTime >= throttleDelay) {
        createRipple(e.clientX, e.clientY, false);
        lastSpawnTime = now;
      }
    }, { passive: true });
